allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = "../build"
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
// Old plugins declare a compileSdk lower than the one their androidx dependencies need (checked by AGP 8.13)
subprojects {
    afterEvaluate { subproject ->
        if (subproject.plugins.hasPlugin("com.android.library")) subproject.android.compileSdk = 36
    }
}
subprojects {
    project.evaluationDependsOn(":app")
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
