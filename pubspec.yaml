name: woxxy
description: LAN File Sharing App
publish_to: 'none'

version: 0.4.1

environment:
  sdk: '>=3.6.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  network_info_plus: ^8.2.2
  desktop_drop: ^0.8.0
  file_picker: ^13.3.0
  path_provider: ^2.1.5
  window_manager: ^0.5.2
  rxdart: ^0.28.0
  flutter_svg: ^2.0.9
  shared_preferences: ^2.2.2
  path: ^1.8.3
  url_launcher: ^6.1.11
  crypto: ^3.0.3
  tray_manager: ^0.8.0
  flutter_local_notifications: ^22.3.3
  local_notifier: ^0.1.5
  dbus: ^0.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  fake_async: ^1.3.3

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path_android: "assets/icons/head.png"
  image_path_ios: "assets/icons/head.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icons/head.png"
  windows:
    generate: true
    image_path: "assets/icons/head.png"
    icon_size: 48
  macos:
    generate: true
    image_path: "assets/icons/head.png"
  linux:
    generate: true
    image_path: "assets/icons/head.png"

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
